name: iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.agdevelops.ainotescanner
      DEVELOPMENT_TEAM: PR4R9G4HZ3
      GENERATION_API_BASE_URL: https://vyro-api-jnz6yqjl4a-el.a.run.app

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true


      - name: Flutter Pub Get
        run: flutter pub get


      # =========================================================
      # APPLE DISTRIBUTION CERTIFICATE
      # =========================================================
      - name: Install Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vyro-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Apple Distribution certificate installed."


      # =========================================================
      # PROVISIONING PROFILE
      # =========================================================
      - name: Install App Store Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/vyro.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_BUNDLE_ID=$(
            echo "$PROFILE_APP_ID" | sed "s/^${PROFILE_TEAM}\\.//"
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROFILE NAME: $PROFILE_NAME"
          echo "PROFILE UUID: $PROFILE_UUID"
          echo "PROFILE TEAM: $PROFILE_TEAM"
          echo "PROFILE APP ID: $PROFILE_APP_ID"
          echo "PROFILE BUNDLE ID: $PROFILE_BUNDLE_ID"
          echo "========================================"

          if [ "$PROFILE_TEAM" != "$DEVELOPMENT_TEAM" ]; then
            echo "ERROR: Provisioning profile belongs to wrong team."
            exit 1
          fi

          if [ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Provisioning profile does not match bundle ID."
            echo "Expected: $BUNDLE_ID"
            echo "Actual:   $PROFILE_BUNDLE_ID"
            exit 1
          fi


      # =========================================================
      # VERIFY CERTIFICATE
      # =========================================================
      - name: Verify Signing Identity
        run: |
          set -e

          security find-identity \
            -v \
            -p codesigning


      # =========================================================
      # FLUTTER CLEAN
      # =========================================================
      - name: Flutter Clean
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          flutter pub get


      # =========================================================
      # POD INSTALL
      # =========================================================
      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install


      # =========================================================
      # CREATE RUNNER-ONLY RELEASE SIGNING CONFIG
      #
      # This xcconfig belongs ONLY to Runner.
      # It is NOT passed to Pods or Swift Package dependencies.
      # =========================================================
      - name: Create Runner Distribution Signing Config
        run: |
          set -e

          cat > ios/Flutter/RunnerDistribution.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}
          PROVISIONING_PROFILE_SPECIFIER = ${IOS_PROFILE_UUID}
          PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}
          EOF

          echo "Created RunnerDistribution.xcconfig:"
          cat ios/Flutter/RunnerDistribution.xcconfig


      # =========================================================
      # APPLY SIGNING ONLY TO RUNNER RELEASE CONFIGURATION
      # =========================================================
      - name: Configure Runner Release
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          # Runner target Release configuration.
          marker = "97C147071C2B0E2C0075B9A6 /* Release */ = {"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "Runner Release configuration was not found."
              )

          # Find the end of this build configuration block.
          end = text.find("\n\t\t};", start)

          if end == -1:
              raise SystemExit(
                  "Could not find end of Runner Release configuration."
              )

          end += len("\n\t\t};")

          block = text[start:end]

          # Remove old signing values from Runner Release only.
          patterns = [
              r'^\s*CODE_SIGN_STYLE\s*=\s*[^;]+;\s*$',
              r'^\s*CODE_SIGN_IDENTITY\s*=\s*[^;]+;\s*$',
              r'^\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;\s*$',
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;\s*$',
              r'^\s*PROVISIONING_PROFILE\s*=\s*[^;]+;\s*$',
          ]

          for pattern in patterns:
              block = re.sub(
                  pattern,
                  "",
                  block,
                  flags=re.MULTILINE
              )

          signing = """
                  CODE_SIGN_STYLE = Manual;
                  CODE_SIGN_IDENTITY = "Apple Distribution";
                  DEVELOPMENT_TEAM = PR4R9G4HZ3;
                  PROVISIONING_PROFILE_SPECIFIER = "$(IOS_PROFILE_UUID)";
          """

          insert = block.rfind("\n\t\t};")

          block = (
              block[:insert]
              + signing
              + block[insert:]
          )

          text = text[:start] + block + text[end:]

          path.write_text(text)

          print("Runner Release configured for distribution signing.")
          PY


      # =========================================================
      # VERIFY RUNNER SETTINGS
      # =========================================================
      - name: Verify Runner Signing Settings
        run: |
          set -e

          echo "Runner Release configuration:"

          grep -n \
            -A25 \
            "97C147071C2B0E2C0075B9A6.*Release" \
            ios/Runner.xcodeproj/project.pbxproj || true


      # =========================================================
      # BUILD IPA
      #
      # NO GLOBAL SIGNING PARAMETERS HERE.
      # =========================================================
      - name: Build IPA
        env:
          GENERATION_API_BASE_URL: ${{ env.GENERATION_API_BASE_URL }}
        run: |
          set -e

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist


      # =========================================================
      # VERIFY IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          find build/ios/ipa \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" \
            -print

          COUNT=$(find build/ios/ipa \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" | wc -l | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "IPA generated successfully."


      # =========================================================
      # UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error


      # =========================================================
      # UPLOAD ARCHIVE
      # =========================================================
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
