name: iOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    env:
      FLUTTER_VERSION: "3.44.2"
      BUNDLE_ID: "com.agdevelops.ainotescanner"
      TEAM_ID: "PR4R9G4HZ3"
      GENERATION_API_BASE_URL: "https://vyro-api-jnz6yqjl4a-el.a.run.app"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # =========================================================
      # 3. FLUTTER DEPENDENCIES
      # =========================================================
      - name: Flutter Pub Get
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

      # =========================================================
      # 4. INSTALL APPLE DISTRIBUTION CERTIFICATE
      #
      # NOTE: this step intentionally does NOT run
      #   openssl pkcs12 -passin ...
      # as a gate. Apple's Keychain exports .p12 files with legacy
      # algorithms (RC2-40-CBC / 3DES) that OpenSSL 3.x rejects unless
      # built with -legacy, and LibreSSL rejects differently. Both report
      # the misleading "Mac verify error: invalid password?" even when the
      # password is correct.
      #
      # Apple's own `security import` uses the Security framework, which
      # reads Apple-exported .p12 files correctly, so it is the authority
      # on whether the password is valid.
      # =========================================================
      - name: Install Apple Distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING APPLE DISTRIBUTION CERTIFICATE"
          echo "========================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/vyro-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERT_PATH="$RUNNER_TEMP/apple_distribution.p12"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          # -----------------------------------------------------
          # Create temporary keychain
          # -----------------------------------------------------

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          # -----------------------------------------------------
          # Check certificate secret
          # -----------------------------------------------------

          if [ -z "${CERTIFICATE_BASE64:-}" ]; then
            echo "ERROR: IOS_DISTRIBUTION_CERTIFICATE_BASE64 is empty."
            exit 1
          fi

          if [ -z "${CERTIFICATE_PASSWORD:-}" ]; then
            echo "ERROR: IOS_DISTRIBUTION_CERTIFICATE_PASSWORD is empty."
            exit 1
          fi

          # -----------------------------------------------------
          # Decode Base64 certificate
          #
          # The secret may be stored with line breaks or stray spaces,
          # so strip CR/LF/space before decoding.
          # -----------------------------------------------------

          echo "$CERTIFICATE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$CERT_PATH"

          # -----------------------------------------------------
          # Verify file exists
          # -----------------------------------------------------

          if [ ! -s "$CERT_PATH" ]; then
            echo "ERROR: Decoded P12 file is empty."
            exit 1
          fi

          echo ""
          echo "Decoded certificate:"
          ls -lh "$CERT_PATH"

          echo ""
          echo "Certificate file type:"
          file "$CERT_PATH"

          # -----------------------------------------------------
          # Non-fatal diagnostics
          #
          # These print useful detail but never gate the build, because
          # OpenSSL cannot be trusted to validate an Apple-exported p12.
          # -----------------------------------------------------

          echo ""
          echo "Password length: ${#CERTIFICATE_PASSWORD} characters"
          echo "(Confirm this matches your export password length.)"

          echo ""
          echo "Diagnostic only - OpenSSL view of the p12 (may report a"
          echo "false 'invalid password' on Apple-exported files):"
          openssl pkcs12 \
            -in "$CERT_PATH" \
            -passin "pass:$CERTIFICATE_PASSWORD" \
            -nokeys \
            -clcerts \
            -noout \
            && echo "OpenSSL: parsed OK" \
            || echo "OpenSSL: could not parse (IGNORED - security import decides)"

          # -----------------------------------------------------
          # Import certificate
          #
          # Flags match the version of this workflow that worked:
          #   -f pkcs12  input format
          #   -t cert    import type
          #   -A         let all applications use the imported key
          #   -T ...     also explicitly allow codesign/security/xcodebuild
          # -----------------------------------------------------

          echo ""
          echo "Importing certificate into temporary keychain..."

          if ! security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -t cert \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild; then

            echo ""
            echo "========================================"
            echo "CERTIFICATE IMPORT FAILED"
            echo "========================================"
            echo ""
            echo "security import rejected the p12 or its password."
            echo "Compare the 'Password length' printed above with the"
            echo "password used when exporting the certificate."
            echo ""
            exit 1
          fi

          echo "Certificate imported."

          # -----------------------------------------------------
          # Give codesign access to the private key
          # -----------------------------------------------------

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # -----------------------------------------------------
          # Set keychain
          # -----------------------------------------------------

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          # -----------------------------------------------------
          # Fail here, clearly, if the identity did not import
          # -----------------------------------------------------

          if ! security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" \
            | grep -q "Apple Distribution"; then

            echo "ERROR: security import ran but no Apple Distribution identity is present."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "CERTIFICATE IMPORT SUCCESSFUL"
          echo "========================================"

      # =========================================================
      # 5. VERIFY CERTIFICATE
      # =========================================================
      - name: Verify Apple Distribution certificate
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CODE SIGNING IDENTITIES"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""

          if ! security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" \
            | grep -q "Apple Distribution"; then

            echo "ERROR: Apple Distribution identity not found."
            exit 1
          fi

          echo "Apple Distribution certificate found."

      # =========================================================
      # 6. INSTALL PROVISIONING PROFILE
      # =========================================================
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING PROVISIONING PROFILE"
          echo "========================================"

          PROFILE_PATH="$RUNNER_TEMP/vyro.mobileprovision"

          if [ -z "${PROFILE_BASE64:-}" ]; then
            echo "ERROR: IOS_PROVISIONING_PROFILE_BASE64 is empty."
            exit 1
          fi

          echo "$PROFILE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$PROFILE_PATH"

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "ERROR: Provisioning profile is empty."
            exit 1
          fi

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo ""
          echo "PROFILE NAME: $PROFILE_NAME"
          echo "PROFILE UUID: $PROFILE_UUID"
          echo "PROFILE TEAM: $PROFILE_TEAM"
          echo "PROFILE APP ID: $PROFILE_APP_ID"
          echo ""

          EXPECTED_APP_ID="${TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "ERROR: Team ID mismatch."
            echo "Expected: $TEAM_ID"
            echo "Actual:   $PROFILE_TEAM"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: Bundle ID mismatch."
            echo "Expected: $EXPECTED_APP_ID"
            echo "Actual:   $PROFILE_APP_ID"
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Provisioning profile installed successfully."

      # =========================================================
      # 7. FLUTTER CLEAN
      # =========================================================
      - name: Flutter clean
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      # =========================================================
      # 8. COCOAPODS
      # =========================================================
      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail

          cd ios

          pod install --repo-update

      # =========================================================
      # 9. FIX TEAM ID IN PROJECT
      # =========================================================
      - name: Fix Apple Team ID
        run: |
          set -euo pipefail

          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: project.pbxproj not found."
            exit 1
          fi

          python3 - "$PBXPROJ" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          # Fix previous typo.
          text = text.replace(
              "PR4R9GAHZ3",
              "PR4R9G4HZ3"
          )

          path.write_text(text)

          print("Team ID normalized to PR4R9G4HZ3.")
          PY

          if grep -q "PR4R9GAHZ3" "$PBXPROJ"; then
            echo "ERROR: Old Team ID still exists."
            exit 1
          fi

          if ! grep -q "PR4R9G4HZ3" "$PBXPROJ"; then
            echo "ERROR: Correct Team ID not found."
            exit 1
          fi

          echo "Team ID verification passed."

      # =========================================================
      # 10. CONFIGURE RUNNER RELEASE SIGNING
      # =========================================================
      - name: Configure Runner Release signing
        run: |
          set -euo pipefail

          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          RUNNER_TARGET_ID="97C146ED1CF9000F007C117D"
          RUNNER_CONFIG_LIST_ID="97C147051CF9000F007C117D"
          RUNNER_RELEASE_ID="97C147071CF9000F007C117D"

          echo "========================================"
          echo "RUNNER SIGNING CONFIGURATION"
          echo "========================================"
          echo "Runner target:      $RUNNER_TARGET_ID"
          echo "Configuration list: $RUNNER_CONFIG_LIST_ID"
          echo "Release config:     $RUNNER_RELEASE_ID"
          echo "Team ID:             $TEAM_ID"
          echo "Bundle ID:           $BUNDLE_ID"
          echo "Profile UUID:        $IOS_PROFILE_UUID"
          echo "========================================"

          python3 - \
            "$PBXPROJ" \
            "$RUNNER_RELEASE_ID" \
            "$TEAM_ID" \
            "$IOS_PROFILE_UUID" \
            "$BUNDLE_ID" <<'PY'

          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          release_id = sys.argv[2]
          team_id = sys.argv[3]
          profile_uuid = sys.argv[4]
          bundle_id = sys.argv[5]

          text = path.read_text()

          marker = f"{release_id} /* Release */ = {{"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  f"ERROR: Release configuration {release_id} not found."
              )

          end = text.find(
              "\n\t\t};\n",
              start
          )

          if end == -1:
              raise SystemExit(
                  "ERROR: Could not find end of Runner Release block."
              )

          end += len("\n\t\t};\n")

          block = text[start:end]

          # Remove existing signing values.
          patterns = [
              r'^\s*CODE_SIGN_STYLE\s*=\s*[^;]+;\s*\n?',
              r'^\s*CODE_SIGN_IDENTITY(?:\[sdk=iphoneos\*\])?\s*=\s*[^;]+;\s*\n?',
              r'^\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;\s*\n?',
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;\s*\n?',
              r'^\s*PROVISIONING_PROFILE\s*=\s*[^;]+;\s*\n?',
          ]

          for pattern in patterns:
              block = re.sub(
                  pattern,
                  "",
                  block,
                  flags=re.MULTILINE
              )

          settings_marker = "\t\tbuildSettings = {\n"

          settings_pos = block.find(settings_marker)

          if settings_pos == -1:
              raise SystemExit(
                  "ERROR: buildSettings block not found."
              )

          insert_pos = settings_pos + len(settings_marker)

          signing = (
              "\t\t\tCODE_SIGN_STYLE = Manual;\n"
              '\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              f"\t\t\tDEVELOPMENT_TEAM = {team_id};\n"
              f'\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_uuid}";\n'
          )

          block = (
              block[:insert_pos]
              + signing
              + block[insert_pos:]
          )

          # Ensure Bundle ID.
          block = re.sub(
              r'^\s*PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;',
              f'\t\t\tPRODUCT_BUNDLE_IDENTIFIER = {bundle_id};',
              block,
              flags=re.MULTILINE
          )

          text = (
              text[:start]
              + block
              + text[end:]
          )

          path.write_text(text)

          print("Runner Release signing configured successfully.")
          PY

      # =========================================================
      # 11. VERIFY RUNNER SIGNING
      # =========================================================
      - name: Verify Runner signing configuration
        run: |
          set -euo pipefail

          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          python3 - "$PBXPROJ" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          release_id = "97C147071CF9000F007C117D"

          marker = f"{release_id} /* Release */ = {{"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: Runner Release configuration not found."
              )

          end = text.find("\n\t\t};\n", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: Runner Release block invalid."
              )

          block = text[start:end]

          required = [
              "CODE_SIGN_STYLE = Manual;",
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              "DEVELOPMENT_TEAM = PR4R9G4HZ3;",
              'PROVISIONING_PROFILE_SPECIFIER = "4ed3491e-53d9-4e60-a4ca-fc4d247eb428";',
              "PRODUCT_BUNDLE_IDENTIFIER = com.agdevelops.ainotescanner;",
          ]

          for setting in required:
              if setting not in block:
                  raise SystemExit(
                      "ERROR: Missing setting:\n" + setting
                  )

          print("")
          print("========================================")
          print("RUNNER SIGNING VERIFIED")
          print("========================================")
          print("Team ID: PR4R9G4HZ3")
          print("Bundle ID: com.agdevelops.ainotescanner")
          print("Profile: 4ed3491e-53d9-4e60-a4ca-fc4d247eb428")
          print("Identity: Apple Distribution")
          print("Signing: Manual")
          print("========================================")
          PY

      # =========================================================
      # 12. ARCHIVE
      # =========================================================
      - name: Archive VYRO
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ARCHIVING VYRO"
          echo "========================================"

          # Keep the keychain unlocked for codesign.
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/VYRO.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive

      # =========================================================
      # 13. VERIFY ARCHIVE
      # =========================================================
      - name: Verify archive
        run: |
          set -euo pipefail

          if [ ! -d "$RUNNER_TEMP/VYRO.xcarchive" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          echo "========================================"
          echo "ARCHIVE SUCCESSFUL"
          echo "========================================"

          ls -lah "$RUNNER_TEMP/VYRO.xcarchive"

      # =========================================================
      # 14. EXPORT IPA
      # =========================================================
      - name: Export IPA
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/export"

          echo "========================================"
          echo "EXPORTING IPA"
          echo "========================================"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/VYRO.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

          echo ""
          echo "Exported files:"
          ls -lah "$RUNNER_TEMP/export"

      # =========================================================
      # 15. VERIFY IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -euo pipefail

          IPA="$(find "$RUNNER_TEMP/export" \
            -maxdepth 1 \
            -name '*.ipa' \
            -print \
            -quit)"

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "========================================"
          echo "IPA GENERATED SUCCESSFULLY"
          echo "========================================"
          echo "$IPA"

          cp "$IPA" "$RUNNER_TEMP/VYRO.ipa"

      # =========================================================
      # 16. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-iOS
          path: ${{ runner.temp }}/VYRO.ipa
          if-no-files-found: error

      # =========================================================
      # 17. UPLOAD ARCHIVE
      # =========================================================
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-XCArchive
          path: ${{ runner.temp }}/VYRO.xcarchive
          if-no-files-found: error
