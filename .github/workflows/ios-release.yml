name: iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.agdevelops.ainotescanner
      DEVELOPMENT_TEAM: PR4R9G4HZ3
      GENERATION_API_BASE_URL: https://vyro-api-jnz6yqjl4a-el.a.run.app

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. SETUP FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true


      # =========================================================
      # 3. FLUTTER PUB GET
      # =========================================================
      - name: Flutter Pub Get
        run: |
          set -euo pipefail
          flutter pub get


      # =========================================================
      # 4. INSTALL APPLE DISTRIBUTION CERTIFICATE
      # =========================================================
      - name: Install Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vyro-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Apple Distribution certificate installed."


      # =========================================================
      # 5. INSTALL APP STORE PROVISIONING PROFILE
      # =========================================================
      - name: Install App Store Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/vyro.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_BUNDLE_ID=$(
            echo "$PROFILE_APP_ID" | sed "s/^${PROFILE_TEAM}\.//"
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "========================================="
          echo "PROVISIONING PROFILE"
          echo "========================================="
          echo "NAME:       $PROFILE_NAME"
          echo "UUID:       $PROFILE_UUID"
          echo "TEAM:       $PROFILE_TEAM"
          echo "APP ID:     $PROFILE_APP_ID"
          echo "BUNDLE ID:  $PROFILE_BUNDLE_ID"
          echo "========================================="

          if [ "$PROFILE_TEAM" != "$DEVELOPMENT_TEAM" ]; then
            echo "ERROR: Wrong Apple Developer Team."
            echo "Expected: $DEVELOPMENT_TEAM"
            echo "Actual:   $PROFILE_TEAM"
            exit 1
          fi

          if [ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Wrong Bundle ID in provisioning profile."
            echo "Expected: $BUNDLE_ID"
            echo "Actual:   $PROFILE_BUNDLE_ID"
            exit 1
          fi

          echo "Provisioning profile verification PASSED."


      # =========================================================
      # 6. VERIFY APPLE DISTRIBUTION CERTIFICATE
      # =========================================================
      - name: Verify Apple Distribution Certificate
        run: |
          set -euo pipefail

          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning

          echo ""

          if ! security find-identity \
            -v \
            -p codesigning | grep -q "Apple Distribution"; then
            echo "ERROR: Apple Distribution certificate not found."
            exit 1
          fi

          echo "Apple Distribution certificate verification PASSED."


      # =========================================================
      # 7. CLEAN FLUTTER
      # =========================================================
      - name: Flutter Clean
        run: |
          set -euo pipefail

          flutter clean

          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          flutter pub get


      # =========================================================
      # 8. COCOAPODS
      # =========================================================
      - name: Install CocoaPods
        working-directory: ios
        run: |
          set -euo pipefail
          pod install


      # =========================================================
      # 9. CONFIGURE RUNNER RELEASE SIGNING
      #
      # IMPORTANT:
      # These are the ACTUAL IDs from this project:
      #
      # Runner target:
      # 97C146ED1CF9000F007C117D
      #
      # Runner configuration list:
      # 97C147051CF9000F007C117D
      #
      # Runner Release:
      # 97C147071CF9000F007C117D
      #
      # Signing is applied ONLY to Runner Release.
      # =========================================================
      - name: Configure Runner Distribution Signing
        env:
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          RUNNER_RELEASE_ID = "97C147071CF9000F007C117D"

          print("Reading Xcode project...")
          print("Runner Release ID:", RUNNER_RELEASE_ID)

          marker = f"{RUNNER_RELEASE_ID} /* Release */ = {{"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: Runner Release configuration was not found."
              )

          end = text.find("\n\t\t};", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: Could not determine Runner Release block."
              )

          end += len("\n\t\t};")

          block = text[start:end]

          # Remove existing signing values ONLY from Runner Release.
          patterns = [
              r'^\s*CODE_SIGN_STYLE\s*=\s*[^;]+;\s*$',
              r'^\s*CODE_SIGN_IDENTITY\s*=\s*[^;]+;\s*$',
              r'^\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;\s*$',
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;\s*$',
              r'^\s*PROVISIONING_PROFILE\s*=\s*[^;]+;\s*$',
          ]

          for pattern in patterns:
              block = re.sub(
                  pattern,
                  "",
                  block,
                  flags=re.MULTILINE
              )

          profile_uuid = os.environ["IOS_PROFILE_UUID"]

          signing = f"""
                  CODE_SIGN_STYLE = Manual;
                  CODE_SIGN_IDENTITY = "Apple Distribution";
                  DEVELOPMENT_TEAM = PR4R9G4HZ3;
                  PROVISIONING_PROFILE_SPECIFIER = "{profile_uuid}";
          """

          insert_at = block.rfind("\n\t\t};")

          if insert_at == -1:
              raise SystemExit(
                  "ERROR: Could not insert signing settings."
              )

          block = (
              block[:insert_at]
              + signing
              + block[insert_at:]
          )

          text = (
              text[:start]
              + block
              + text[end:]
          )

          path.write_text(text)

          print("")
          print("========================================")
          print("RUNNER SIGNING CONFIGURED")
          print("========================================")
          print("Team:       PR4R9G4HZ3")
          print("Identity:   Apple Distribution")
          print("Profile:    " + profile_uuid)
          print("Bundle ID:  com.agdevelops.ainotescanner")
          print("========================================")
          PY


      # =========================================================
      # 10. VERIFY RUNNER SIGNING
      # =========================================================
      - name: Verify Runner Signing
        run: |
          set -euo pipefail

          echo "Checking Runner Release signing settings..."

          python3 <<'PY'
          from pathlib import Path

          text = Path(
              "ios/Runner.xcodeproj/project.pbxproj"
          ).read_text()

          marker = "97C147071CF9000F007C117D /* Release */ = {"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: Runner Release configuration not found."
              )

          end = text.find("\n\t\t};", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: Runner Release block could not be read."
              )

          block = text[start:end]

          required = [
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              'DEVELOPMENT_TEAM = PR4R9G4HZ3;',
              'PROVISIONING_PROFILE_SPECIFIER = "4ed3491e-53d9-4e60-a4ca-fc4d247eb428";',
          ]

          for item in required:
              if item not in block:
                  print("")
                  print("MISSING:", item)
                  print("")
                  print(block)
                  raise SystemExit(
                      "ERROR: Runner signing configuration is incomplete."
                  )

          print("Runner signing configuration verified.")
          PY


      # =========================================================
      # 11. BUILD IPA
      #
      # NO GLOBAL SIGNING PARAMETERS.
      #
      # This prevents the provisioning profile from being applied
      # to Firebase, GoogleUtilities, Pods and Swift Packages.
      # =========================================================
      - name: Build IPA
        env:
          GENERATION_API_BASE_URL: ${{ env.GENERATION_API_BASE_URL }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING VYRO IOS IPA"
          echo "========================================"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team: $DEVELOPMENT_TEAM"
          echo "Backend: $GENERATION_API_BASE_URL"
          echo "Profile: $IOS_PROFILE_UUID"
          echo "========================================"

          flutter build ipa \
            --release \
            --dart-define=GENERATION_API_BASE_URL="$GENERATION_API_BASE_URL" \
            --export-options-plist=ios/ExportOptions.plist


      # =========================================================
      # 12. VERIFY IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -euo pipefail

          echo "Generated IPA files:"

          find build/ios/ipa \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" \
            -print

          IPA_COUNT=$(
            find build/ios/ipa \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" |
            wc -l |
            tr -d ' '
          )

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo ""
          echo "IPA generated successfully."


      # =========================================================
      # 13. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error


      # =========================================================
      # 14. UPLOAD XCARCHIVE
      # =========================================================
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
