name: iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.agdevelops.ainotescanner
      DEVELOPMENT_TEAM: PR4R9G4HZ3
      GENERATION_API_BASE_URL: https://vyro-api-jnz6yqjl4a-el.a.run.app

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true


      # =========================================================
      # 3. FLUTTER PUB GET
      # =========================================================
      - name: Flutter Pub Get
        run: |
          set -e
          flutter pub get


      # =========================================================
      # 4. INSTALL APPLE DISTRIBUTION CERTIFICATE
      # =========================================================
      - name: Install Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vyro-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Apple Distribution certificate installed."


      # =========================================================
      # 5. INSTALL APP STORE PROVISIONING PROFILE
      # =========================================================
      - name: Install App Store Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/vyro.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_BUNDLE_ID=$(
            echo "$PROFILE_APP_ID" | sed "s/^${PROFILE_TEAM}\.//"
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "========================================="
          echo "PROVISIONING PROFILE"
          echo "========================================="
          echo "NAME:       $PROFILE_NAME"
          echo "UUID:       $PROFILE_UUID"
          echo "TEAM:       $PROFILE_TEAM"
          echo "APP ID:     $PROFILE_APP_ID"
          echo "BUNDLE ID:  $PROFILE_BUNDLE_ID"
          echo "========================================="

          if [ "$PROFILE_TEAM" != "$DEVELOPMENT_TEAM" ]; then
            echo ""
            echo "ERROR: Provisioning profile belongs to wrong team."
            echo "Expected: $DEVELOPMENT_TEAM"
            echo "Actual:   $PROFILE_TEAM"
            exit 1
          fi

          if [ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo ""
            echo "ERROR: Provisioning profile does not match bundle ID."
            echo "Expected: $BUNDLE_ID"
            echo "Actual:   $PROFILE_BUNDLE_ID"
            exit 1
          fi

          echo ""
          echo "Profile verification PASSED."


      # =========================================================
      # 6. VERIFY CERTIFICATE
      # =========================================================
      - name: Verify Apple Distribution Certificate
        run: |
          set -e

          echo "Available code signing identities:"

          security find-identity \
            -v \
            -p codesigning

          echo ""
          echo "Looking for Apple Distribution certificate..."

          security find-identity \
            -v \
            -p codesigning | grep "Apple Distribution"

          echo ""
          echo "Certificate verification PASSED."


      # =========================================================
      # 7. CLEAN FLUTTER
      # =========================================================
      - name: Flutter Clean
        run: |
          set -e

          flutter clean

          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          flutter pub get


      # =========================================================
      # 8. POD INSTALL
      # =========================================================
      - name: Install CocoaPods
        working-directory: ios
        run: |
          set -e

          pod install


      # =========================================================
      # 9. FIND RUNNER RELEASE CONFIGURATION DYNAMICALLY
      #
      # DO NOT USE A HARD-CODED XCODE CONFIGURATION UUID.
      # =========================================================
      - name: Configure Runner Distribution Signing
        env:
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          print("Reading Xcode project...")

          # -----------------------------------------------------
          # Find Runner PBXNativeTarget.
          # -----------------------------------------------------
          runner_match = re.search(
              r'([A-F0-9]{24}) /\* Runner \*/ = \{',
              text
          )

          if not runner_match:
              raise SystemExit(
                  "ERROR: Runner target was not found."
              )

          runner_target_id = runner_match.group(1)

          print(
              f"Runner target ID: {runner_target_id}"
          )

          # -----------------------------------------------------
          # Find the Runner target block.
          # -----------------------------------------------------
          target_start = runner_match.start()

          brace_start = text.find("{", runner_match.start())

          depth = 0
          target_end = None

          for i in range(brace_start, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      target_end = i + 1
                      break

          if target_end is None:
              raise SystemExit(
                  "ERROR: Could not parse Runner target."
              )

          runner_block = text[target_start:target_end]

          # -----------------------------------------------------
          # Find Runner buildConfigurationList.
          # -----------------------------------------------------
          config_list_match = re.search(
              r'buildConfigurationList\s*=\s*'
              r'([A-F0-9]{24})\s*/\* '
              r'Build configuration list for PBXNativeTarget "Runner"'
              r' \*/',
              runner_block
          )

          if not config_list_match:
              raise SystemExit(
                  "ERROR: Runner build configuration list was not found."
              )

          config_list_id = config_list_match.group(1)

          print(
              f"Runner configuration list: {config_list_id}"
          )

          # -----------------------------------------------------
          # Find the actual configuration list.
          # -----------------------------------------------------
          config_list_pattern = re.compile(
              rf'{config_list_id}\s*/\* '
              r'Build configuration list for PBXNativeTarget "Runner"'
              r' \*/\s*=\s*\{(.*?)\n\s*\};',
              re.DOTALL
          )

          config_list_match = config_list_pattern.search(text)

          if not config_list_match:
              raise SystemExit(
                  "ERROR: Runner configuration list block was not found."
              )

          config_list_body = config_list_match.group(1)

          # -----------------------------------------------------
          # Extract Runner configuration IDs.
          # -----------------------------------------------------
          configurations = re.findall(
              r'([A-F0-9]{24})\s*/\*\s*(Debug|Release|Profile)\s*\*/',
              config_list_body
          )

          if not configurations:
              raise SystemExit(
                  "ERROR: No Runner build configurations were found."
              )

          print("")
          print("Runner configurations:")

          release_id = None

          for config_id, config_name in configurations:
              print(
                  f"  {config_name}: {config_id}"
              )

              if config_name == "Release":
                  release_id = config_id

          if release_id is None:
              raise SystemExit(
                  "ERROR: Runner Release configuration was not found."
              )

          print("")
          print(
              f"Runner Release configuration ID: {release_id}"
          )

          # -----------------------------------------------------
          # Find Release configuration block.
          # -----------------------------------------------------
          release_pattern = re.compile(
              rf'{release_id}\s*/\*\s*Release\s*\*/\s*=\s*\{{'
              r'(.*?)'
              r'\n\s*\};',
              re.DOTALL
          )

          release_match = release_pattern.search(text)

          if not release_match:
              raise SystemExit(
                  "ERROR: Runner Release configuration block was not found."
              )

          release_body = release_match.group(1)

          # -----------------------------------------------------
          # Remove existing signing settings ONLY from Runner
          # Release configuration.
          # -----------------------------------------------------
          signing_patterns = [
              r'^\s*CODE_SIGN_STYLE\s*=\s*[^;]+;\s*$',
              r'^\s*CODE_SIGN_IDENTITY\s*=\s*[^;]+;\s*$',
              r'^\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;\s*$',
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;\s*$',
              r'^\s*PROVISIONING_PROFILE\s*=\s*[^;]+;\s*$',
          ]

          for pattern in signing_patterns:
              release_body = re.sub(
                  pattern,
                  "",
                  release_body,
                  flags=re.MULTILINE
              )

          # -----------------------------------------------------
          # Add signing ONLY to Runner Release.
          # -----------------------------------------------------
          signing_settings = f"""
                  CODE_SIGN_STYLE = Manual;
                  CODE_SIGN_IDENTITY = "Apple Distribution";
                  DEVELOPMENT_TEAM = PR4R9G4HZ3;
                  PROVISIONING_PROFILE_SPECIFIER = "{__import__('os').environ['IOS_PROFILE_UUID']}";
          """

          release_body = (
              release_body.rstrip()
              + "\n"
              + signing_settings
          )

          # -----------------------------------------------------
          # Write modified block back.
          # -----------------------------------------------------
          text = (
              text[:release_match.start(1)]
              + release_body
              + text[release_match.end(1):]
          )

          path.write_text(text)

          print("")
          print("========================================")
          print("RUNNER DISTRIBUTION SIGNING CONFIGURED")
          print("========================================")
          print("Team:       PR4R9G4HZ3")
          print("Identity:   Apple Distribution")
          print(
              "Profile:    "
              + __import__('os').environ['IOS_PROFILE_UUID']
          )
          print("Bundle ID:  com.agdevelops.ainotescanner")
          print("========================================")
          PY


      # =========================================================
      # 10. VERIFY PROJECT SIGNING SETTINGS
      # =========================================================
      - name: Verify Runner Signing Configuration
        run: |
          set -e

          echo "Checking Runner project..."

          grep -n \
            "Apple Distribution" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo ""

          grep -n \
            "PR4R9G4HZ3" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo ""

          grep -n \
            "PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj || true


      # =========================================================
      # 11. BUILD IPA
      #
      # IMPORTANT:
      # NO GLOBAL CODE_SIGN_IDENTITY
      # NO GLOBAL DEVELOPMENT_TEAM
      # NO GLOBAL PROVISIONING_PROFILE
      # NO GLOBAL PROVISIONING_PROFILE_SPECIFIER
      #
      # Therefore Firebase / Pods / Swift Packages do not
      # receive the Runner provisioning profile.
      # =========================================================
      - name: Build IPA
        env:
          GENERATION_API_BASE_URL: ${{ env.GENERATION_API_BASE_URL }}
        run: |
          set -e

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist


      # =========================================================
      # 12. VERIFY IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          echo "Checking generated IPA..."

          find build/ios/ipa \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" \
            -print

          IPA_COUNT=$(
            find build/ios/ipa \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" |
            wc -l |
            tr -d ' '
          )

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA GENERATED SUCCESSFULLY"
          echo "========================================"


      # =========================================================
      # 13. UPLOAD IPA
      # =========================================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error


      # =========================================================
      # 14. UPLOAD XCARCHIVE
      # =========================================================
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
