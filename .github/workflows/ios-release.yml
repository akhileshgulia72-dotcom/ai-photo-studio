name: iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.agdevelops.ainotescanner
      DEVELOPMENT_TEAM: PR4R9GAHZ3
      GENERATION_API_BASE_URL: https://vyro-api-jnz6yqjl4a-el.a.run.app

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true


      # =========================================================
      # 3. Flutter dependencies
      # =========================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # =========================================================
      # 4. Install Apple Distribution Certificate
      # =========================================================
      - name: Install Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vyro-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Apple Distribution certificate installed."


      # =========================================================
      # 5. Install provisioning profile
      # =========================================================
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/vyro.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_EXPIRATION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :ExpirationDate" \
              "$RUNNER_TEMP/profile.plist"
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "========================================="
          echo "Provisioning Profile"
          echo "========================================="
          echo "Name:       $PROFILE_NAME"
          echo "UUID:       $PROFILE_UUID"
          echo "App ID:     $PROFILE_APP_ID"
          echo "Team ID:    $PROFILE_TEAM_ID"
          echo "Expires:    $PROFILE_EXPIRATION"
          echo "========================================="


      # =========================================================
      # 6. Verify certificate
      # =========================================================
      - name: Verify Signing Identity
        run: |
          set -e

          echo "Available code signing identities:"

          security find-identity \
            -v \
            -p codesigning

          echo ""
          echo "Installed provisioning profiles:"

          ls -la \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"


      # =========================================================
      # 7. Verify provisioning profile matches app
      # =========================================================
      - name: Verify Provisioning Profile
        run: |
          set -e

          echo "Checking provisioning profile..."

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo ""

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:com.apple.developer.team-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo ""

          echo "Expected:"
          echo "Team: $DEVELOPMENT_TEAM"
          echo "Bundle: $BUNDLE_ID"


      # =========================================================
      # 8. Clean previous Flutter/iOS build
      # =========================================================
      - name: Flutter Clean
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          flutter pub get


      # =========================================================
      # 9. Install CocoaPods
      # =========================================================
      - name: Install CocoaPods Dependencies
        working-directory: ios
        run: |
          pod repo update
          pod install


      # =========================================================
      # 10. Build Flutter IPA
      #
      # IMPORTANT:
      #
      # NO:
      # DEVELOPMENT_TEAM=...
      # CODE_SIGN_IDENTITY=...
      # CODE_SIGN_STYLE=...
      # PROVISIONING_PROFILE=...
      # PROVISIONING_PROFILE_SPECIFIER=...
      #
      # This prevents the signing profile from being propagated
      # into Firebase / Pods / Swift Package dependencies.
      # =========================================================
      - name: Build IPA
        env:
          GENERATION_API_BASE_URL: ${{ env.GENERATION_API_BASE_URL }}
        run: |
          set -e

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist


      # =========================================================
      # 11. Show generated IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          echo "Generated IPA files:"

          find build/ios/ipa \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" \
            -print

          IPA_COUNT=$(find build/ios/ipa \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" | wc -l | tr -d ' ')

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo ""
          echo "IPA generated successfully."


      # =========================================================
      # 12. Upload IPA
      # =========================================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error


      # =========================================================
      # 13. Upload archive
      # =========================================================
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
