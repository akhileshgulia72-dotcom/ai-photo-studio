name: iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.agdevelops.ainotescanner
      DEVELOPMENT_TEAM: PR4R9GAHZ3
      GENERATION_API_BASE_URL: https://vyro-api-jnz6yqjl4a-el.a.run.app

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 3. Flutter dependencies
      # ---------------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # ---------------------------------------------------------
      # 4. Import Apple Distribution Certificate
      # ---------------------------------------------------------
      - name: Install Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Certificate installed successfully."

      # ---------------------------------------------------------
      # 5. Install provisioning profile
      # ---------------------------------------------------------
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          APPLICATION_IDENTIFIER=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Provisioning Profile:"
          echo "UUID: $PROFILE_UUID"
          echo "Name: $PROFILE_NAME"
          echo "Application Identifier: $APPLICATION_IDENTIFIER"

      # ---------------------------------------------------------
      # 6. Verify certificate
      # ---------------------------------------------------------
      - name: Verify Apple Signing Certificate
        run: |
          set -e

          security find-identity \
            -v \
            -p codesigning

      # ---------------------------------------------------------
      # 7. Configure ONLY Runner Release signing
      #
      # IMPORTANT:
      # We do NOT pass signing parameters globally to xcodebuild.
      # This prevents Firebase / Pods / GoogleSignIn / etc.
      # from receiving the Runner provisioning profile.
      # ---------------------------------------------------------
      - name: Configure Runner Release Signing
        env:
          IOS_PROFILE_NAME: ${{ env.IOS_PROFILE_NAME }}
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          marker = "97C147071C2E0E2C0075B9A6 /* Release */ = {"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: Runner Release build configuration was not found."
              )

          end = text.find("\n\t\t};", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: Could not determine Runner Release configuration block."
              )

          end += len("\n\t\t};")

          block = text[start:end]

          # Remove any existing signing settings from ONLY this block.
          block = re.sub(
              r'^\s*CODE_SIGN_STYLE\s*=\s*[^;]+;\s*$',
              '',
              block,
              flags=re.MULTILINE
          )

          block = re.sub(
              r'^\s*CODE_SIGN_IDENTITY\s*=\s*[^;]+;\s*$',
              '',
              block,
              flags=re.MULTILINE
          )

          block = re.sub(
              r'^\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;\s*$',
              '',
              block,
              flags=re.MULTILINE
          )

          block = re.sub(
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;\s*$',
              '',
              block,
              flags=re.MULTILINE
          )

          block = re.sub(
              r'^\s*PROVISIONING_PROFILE\s*=\s*[^;]+;\s*$',
              '',
              block,
              flags=re.MULTILINE
          )

          # Add signing settings ONLY to Runner Release.
          signing = f"""
                  CODE_SIGN_STYLE = Manual;
                  CODE_SIGN_IDENTITY = "Apple Distribution";
                  DEVELOPMENT_TEAM = PR4R9GAHZ3;
                  PROVISIONING_PROFILE_SPECIFIER = "$(IOS_PROFILE_NAME)";
          """

          insert_at = block.rfind("\n\t\t};")

          if insert_at == -1:
              raise SystemExit(
                  "ERROR: Could not insert Runner Release signing settings."
              )

          block = block[:insert_at] + signing + block[insert_at:]

          text = text[:start] + block + text[end:]

          path.write_text(text)

          print("Runner Release signing configured.")
          PY

          echo "Checking Runner Release configuration..."

          sed -n \
            '/97C147071C2B0E2C0075B9A6 \/\* Release \*\/ = {/,/};/p' \
            ios/Runner.xcodeproj/project.pbxproj

      # ---------------------------------------------------------
      # 8. Make sure there are NO global provisioning settings
      # ---------------------------------------------------------
      - name: Check Signing Configuration
        run: |
          set -e

          echo "Checking for provisioning settings..."

          grep -n \
            "PROVISIONING_PROFILE_SPECIFIER\|PROVISIONING_PROFILE =" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo ""
          echo "Checking for Apple Distribution..."

          grep -n \
            "Apple Distribution" \
            ios/Runner.xcodeproj/project.pbxproj || true

      # ---------------------------------------------------------
      # 9. Clean Flutter
      # ---------------------------------------------------------
      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      # ---------------------------------------------------------
      # 10. Build IPA
      #
      # IMPORTANT:
      # No DEVELOPMENT_TEAM
      # No CODE_SIGN_IDENTITY
      # No PROVISIONING_PROFILE_SPECIFIER
      #
      # Signing is already configured ONLY for Runner.
      # ---------------------------------------------------------
      - name: Build iOS IPA
        env:
          GENERATION_API_BASE_URL: ${{ env.GENERATION_API_BASE_URL }}
        run: |
          set -e

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      # ---------------------------------------------------------
      # 11. Upload IPA
      # ---------------------------------------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # ---------------------------------------------------------
      # 12. Upload archive
      # ---------------------------------------------------------
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
