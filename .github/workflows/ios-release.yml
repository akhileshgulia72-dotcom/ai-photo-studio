name: iOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    env:
      FLUTTER_VERSION: "3.44.2"
      BUNDLE_ID: "com.agdevelops.ainotescanner"
      TEAM_ID: "PR4R9G4HZ3"
      GENERATION_API_BASE_URL: "https://vyro-api-jnz6yqjl4a-el.a.run.app"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. PREFLIGHT - SECRET VALIDATION
      #
      # GitHub substitutes an empty string for a secret it cannot
      # resolve, with no error of its own. This reports every
      # missing secret in one pass, prints names and lengths only
      # (never values), and fails before any signing work starts.
      #
      # The names below must match the repository secrets exactly.
      # They are repository-scoped; this job declares no
      # environment, so environment secrets would be invisible.
      # =========================================================
      - name: Validate required secrets
        env:
          S_CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          S_CERT_PW: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          S_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          S_KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
          S_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S_ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -uo pipefail

          echo "========================================"
          echo "REQUIRED SECRETS"
          echo "========================================"

          failed=0

          report() {
            local name="$1"
            local value="${2:-}"

            if [ -z "$value" ]; then
              printf '  MISSING  %-38s (empty or not set)\n' "$name"
              failed=1
            else
              printf '  present  %-38s %s bytes\n' "$name" "${#value}"
            fi
          }

          report "IOS_CERTIFICATE_BASE64"          "${S_CERT_B64:-}"
          report "IOS_CERTIFICATE_PASSWORD"        "${S_CERT_PW:-}"
          report "IOS_PROVISIONING_PROFILE_BASE64" "${S_PROFILE_B64:-}"
          report "KEYCHAIN_PASSWORD"               "${S_KEYCHAIN_PW:-}"
          report "APP_STORE_CONNECT_KEY_ID"        "${S_ASC_KEY_ID:-}"
          report "APP_STORE_CONNECT_ISSUER_ID"     "${S_ASC_ISSUER:-}"
          report "APP_STORE_CONNECT_PRIVATE_KEY"   "${S_ASC_KEY:-}"

          echo "========================================"

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "ERROR: one or more required secrets are missing."
            echo ""
            echo "Add them under:"
            echo "  Settings > Secrets and variables > Actions"
            echo "  > Repository secrets (NOT environment secrets)"
            echo ""
            echo "Expected values:"
            echo "  IOS_CERTIFICATE_BASE64"
            echo "      base64 of the Apple Distribution .p12 (single line)"
            echo "  IOS_CERTIFICATE_PASSWORD"
            echo "      the password set when exporting that .p12"
            echo "  IOS_PROVISIONING_PROFILE_BASE64"
            echo "      base64 of the App Store .mobileprovision (single line)"
            echo "  KEYCHAIN_PASSWORD"
            echo "      any random string; used for the temporary CI keychain"
            echo "  APP_STORE_CONNECT_KEY_ID / _ISSUER_ID / _PRIVATE_KEY"
            echo "      App Store Connect API key (Users and Access > Integrations)"
            echo ""
            echo "Note: GitHub ignores secrets larger than 48 KB and will"
            echo "not report an error. A base64 .p12 is normally 5-10 KB."
            echo ""
            exit 1
          fi

          echo "All required secrets are present."

      # =========================================================
      # 3. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # =========================================================
      # 4. FLUTTER DEPENDENCIES
      # =========================================================
      - name: Flutter Pub Get
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

      # =========================================================
      # 5. INSTALL APPLE DISTRIBUTION CERTIFICATE
      #
      # NOTE: this step intentionally does NOT run
      #   openssl pkcs12 -passin ...
      # as a gate. Apple's Keychain exports .p12 files with legacy
      # algorithms (RC2-40-CBC / 3DES) that OpenSSL 3.x rejects unless
      # built with -legacy, and LibreSSL rejects differently. Both report
      # the misleading "Mac verify error: invalid password?" even when the
      # password is correct.
      #
      # Apple's own `security import` uses the Security framework, which
      # reads Apple-exported .p12 files correctly, so it is the authority
      # on whether the password is valid.
      # =========================================================
      - name: Install Apple Distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING APPLE DISTRIBUTION CERTIFICATE"
          echo "========================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/vyro-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERT_PATH="$RUNNER_TEMP/apple_distribution.p12"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          # -----------------------------------------------------
          # Create temporary keychain
          # -----------------------------------------------------

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          # -----------------------------------------------------
          # Check certificate secret
          # -----------------------------------------------------

          if [ -z "${CERTIFICATE_BASE64:-}" ]; then
            echo "ERROR: IOS_CERTIFICATE_BASE64 is empty."
            exit 1
          fi

          if [ -z "${CERTIFICATE_PASSWORD:-}" ]; then
            echo "ERROR: IOS_CERTIFICATE_PASSWORD is empty."
            exit 1
          fi

          # -----------------------------------------------------
          # Decode Base64 certificate
          #
          # The secret may be stored with line breaks or stray spaces,
          # so strip CR/LF/space before decoding.
          # -----------------------------------------------------

          echo "$CERTIFICATE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$CERT_PATH"

          # -----------------------------------------------------
          # Verify file exists
          # -----------------------------------------------------

          if [ ! -s "$CERT_PATH" ]; then
            echo "ERROR: Decoded P12 file is empty."
            exit 1
          fi

          echo ""
          echo "Decoded certificate:"
          ls -lh "$CERT_PATH"

          echo ""
          echo "Certificate file type:"
          file "$CERT_PATH"

          # -----------------------------------------------------
          # Non-fatal diagnostics
          #
          # These print useful detail but never gate the build, because
          # OpenSSL cannot be trusted to validate an Apple-exported p12.
          # -----------------------------------------------------

          echo ""
          echo "Password length: ${#CERTIFICATE_PASSWORD} characters"
          echo "(Confirm this matches your export password length.)"

          echo ""
          echo "Diagnostic only - OpenSSL view of the p12 (may report a"
          echo "false 'invalid password' on Apple-exported files):"
          openssl pkcs12 \
            -in "$CERT_PATH" \
            -passin "pass:$CERTIFICATE_PASSWORD" \
            -nokeys \
            -clcerts \
            -noout \
            && echo "OpenSSL: parsed OK" \
            || echo "OpenSSL: could not parse (IGNORED - security import decides)"

          # -----------------------------------------------------
          # Import certificate
          #
          # Flags match the version of this workflow that worked:
          #   -f pkcs12  input format
          #   -t cert    import type
          #   -A         let all applications use the imported key
          #   -T ...     also explicitly allow codesign/security/xcodebuild
          # -----------------------------------------------------

          echo ""
          echo "Importing certificate into temporary keychain..."

          if ! security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -t cert \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild; then

            echo ""
            echo "========================================"
            echo "CERTIFICATE IMPORT FAILED"
            echo "========================================"
            echo ""
            echo "security import rejected the p12 or its password."
            echo "Compare the 'Password length' printed above with the"
            echo "password used when exporting the certificate."
            echo ""
            exit 1
          fi

          echo "Certificate imported."

          # -----------------------------------------------------
          # Give codesign access to the private key
          # -----------------------------------------------------

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # -----------------------------------------------------
          # Set keychain
          # -----------------------------------------------------

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          # -----------------------------------------------------
          # Fail here, clearly, if the identity did not import
          # -----------------------------------------------------

          if ! security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" \
            | grep -q "Apple Distribution"; then

            echo "ERROR: security import ran but no Apple Distribution identity is present."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "CERTIFICATE IMPORT SUCCESSFUL"
          echo "========================================"

      # =========================================================
      # 6. VERIFY CERTIFICATE
      # =========================================================
      - name: Verify Apple Distribution certificate
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CODE SIGNING IDENTITIES"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""

          if ! security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" \
            | grep -q "Apple Distribution"; then

            echo "ERROR: Apple Distribution identity not found."
            exit 1
          fi

          echo "Apple Distribution certificate found."

      # =========================================================
      # 7. INSTALL PROVISIONING PROFILE
      # =========================================================
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING PROVISIONING PROFILE"
          echo "========================================"

          PROFILE_PATH="$RUNNER_TEMP/vyro.mobileprovision"

          if [ -z "${PROFILE_BASE64:-}" ]; then
            echo "ERROR: IOS_PROVISIONING_PROFILE_BASE64 is empty."
            exit 1
          fi

          echo "$PROFILE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$PROFILE_PATH"

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "ERROR: Provisioning profile is empty."
            exit 1
          fi

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo ""
          echo "PROFILE NAME: $PROFILE_NAME"
          echo "PROFILE UUID: $PROFILE_UUID"
          echo "PROFILE TEAM: $PROFILE_TEAM"
          echo "PROFILE APP ID: $PROFILE_APP_ID"
          echo ""

          EXPECTED_APP_ID="${TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "ERROR: Team ID mismatch."
            echo "Expected: $TEAM_ID"
            echo "Actual:   $PROFILE_TEAM"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: Bundle ID mismatch."
            echo "Expected: $EXPECTED_APP_ID"
            echo "Actual:   $PROFILE_APP_ID"
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Provisioning profile installed successfully."

      # =========================================================
      # 8. FLUTTER CLEAN
      # =========================================================
      - name: Flutter clean
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      # =========================================================
      # 9. VERIFY THE PODS XCCONFIG INCLUDE
      #
      # The Runner target has no baseConfigurationReference set, so the
      # ONLY path by which it inherits the CocoaPods build settings is the
      # `#include? "Pods/Target Support Files/Pods-Runner/..."` line in
      # Flutter/Debug.xcconfig and Flutter/Release.xcconfig.
      #
      # Without it the Runner target cannot see PODFILE_LOCK (or the Pods
      # framework search paths), and the archive fails with:
      #     diff: /Podfile.lock: No such file or directory
      #     error: The sandbox is not in sync with the Podfile.lock
      #
      # flutter_tools normally injects this line in
      # addPodsDependencyToFlutterXcconfig, but that runs from
      # setupPodfile during a *Flutter* build, and this job archives with
      # xcodebuild directly, so it never happens here.
      #
      # The lines are committed; this fails fast if a future
      # `flutter clean` or template change drops them.
      # =========================================================
      - name: Verify Pods xcconfig include
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PODS XCCONFIG INCLUDE"
          echo "========================================"

          failed=0

          for pair in "Debug:debug" "Release:release"
          do
            file="ios/Flutter/${pair%%:*}.xcconfig"
            mode="${pair##*:}"
            expected="Pods/Target Support Files/Pods-Runner/Pods-Runner.${mode}.xcconfig"

            echo ""
            echo "--- $file ---"
            cat "$file"

            if grep -qF "$expected" "$file"; then
              echo "  contains: $expected"
            else
              echo "ERROR: $file does not include the Pods xcconfig."
              echo "Expected a line containing:"
              echo "  $expected"
              failed=1
            fi
          done

          echo ""
          echo "========================================"

          if [ "$failed" -ne 0 ]; then
            echo "ERROR: CocoaPods integration would not be wired into the"
            echo "Runner target, so PODFILE_LOCK and the Pods search paths"
            echo "would be missing and the archive would fail."
            exit 1
          fi

          echo "Pods xcconfig is included by both configurations."

      # =========================================================
      # 10. COCOAPODS
      # =========================================================
      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail

          cd ios

          pod install --repo-update

      # =========================================================
      # 11. MATCH THE GENERATED SWIFT PACKAGE TO THE APP DEPLOYMENT TARGET
      #
      # Flutter declares its iOS floor as a hard-coded iOS 13.0 in
      # flutter_tools (darwin.dart: Version(13, 0, null)), so the
      # generated FlutterGeneratedPluginSwiftPackage/Package.swift
      # declares:
      #     platforms: [ .iOS("13.0") ]
      #
      # Swift Package Manager then refuses any dependency whose floor is
      # higher, which breaks the Firebase products that require 15.0:
      #     "The package product 'firebase-core' requires minimum
      #      platform version 15.0 for the iOS platform, but this target
      #      supports 13.0"
      #
      # Flutter ships the correct repair as
      # SwiftPackageManager.updateMinimumDeployment, which raises this
      # package to the Xcode project's IPHONEOS_DEPLOYMENT_TARGET. It is
      # guarded by `if (app.project.usesSwiftPackageManager)`
      # (ios/mac.dart:352), and a stale
      # swift_package_manager_enabled['ios'] = false in
      # .flutter-plugins-dependencies means that branch is skipped.
      #
      # This applies exactly the bump Flutter would have applied. It is
      # idempotent, and it fails loudly rather than letting the archive
      # fail later with less context.
      # =========================================================
      - name: Align generated Swift package platform with the app
        run: |
          set -euo pipefail

          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          MANIFEST="ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift"

          echo "========================================"
          echo "ALIGNING SWIFT PACKAGE PLATFORM"
          echo "========================================"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: generated Swift package manifest not found:"
            echo "  $MANIFEST"
            echo "It is written by 'flutter pub get'. Ensure that step ran."
            exit 1
          fi

          TARGET=$(
            grep -m1 'IPHONEOS_DEPLOYMENT_TARGET' "$PBXPROJ" \
              | sed 's/.*= *\([0-9.]*\);.*/\1/'
          )

          if [ -z "$TARGET" ]; then
            echo "ERROR: could not read IPHONEOS_DEPLOYMENT_TARGET from the project."
            exit 1
          fi

          echo "App iOS deployment target : $TARGET"
          echo "Manifest before:"
          sed 's/^/    /' "$MANIFEST"

          python3 - "$MANIFEST" "$TARGET" <<'PY'
          import re
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          target = sys.argv[2]

          text = manifest.read_text()
          updated, count = re.subn(
              r'\.iOS\("[0-9.]+"\)',
              '.iOS("' + target + '")',
              text,
          )

          if count == 0:
              raise SystemExit(
                  'ERROR: no .iOS("...") entry found in the generated manifest.'
              )

          manifest.write_text(updated)
          print('Raised ' + str(count) + ' platform entry to iOS ' + target + '.')
          PY

          echo "Manifest after:"
          sed 's/^/    /' "$MANIFEST"

          if ! grep -q ".iOS(\"$TARGET\")" "$MANIFEST"; then
            echo "ERROR: manifest still does not declare iOS $TARGET."
            exit 1
          fi

          echo ""
          echo "Generated Swift package now targets iOS $TARGET."
      # =========================================================
      # 12. SCOPE SIGNING TO THE RUNNER APP TARGET
      #
      # Signing is applied ONLY to the three Runner app
      # XCBuildConfiguration blocks (Debug / Profile / Release).
      # It is deliberately NOT applied to:
      #   - the RunnerTests target
      #   - the project-level configurations
      #   - any CocoaPods target
      # and it is NOT passed to xcodebuild as a command-line
      # setting, because global settings propagate to every target
      # in the workspace and break signing on Pods-Runner,
      # Firebase, gRPC, GoogleUtilities, Promises and friends with:
      #   "does not support provisioning profiles, but provisioning
      #    profile ... has been manually specified"
      #
      # Blocks are located by their exact IDs and closed by brace
      # counting, so no regex can mis-detect the end of a block.
      # =========================================================
      - name: Configure Runner target signing
        run: |
          set -euo pipefail

          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: project.pbxproj not found."
            exit 1
          fi

          cp "$PBXPROJ" "$RUNNER_TEMP/project.pbxproj.before"

          echo "========================================"
          echo "SCOPING SIGNING TO THE RUNNER TARGET"
          echo "========================================"
          echo "Team ID:      $TEAM_ID"
          echo "Bundle ID:    $BUNDLE_ID"
          echo "Profile UUID: $IOS_PROFILE_UUID"
          echo "Identity:     Apple Distribution"
          echo "========================================"

          python3 - \
            "$PBXPROJ" \
            "$TEAM_ID" \
            "$IOS_PROFILE_UUID" \
            "$BUNDLE_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          team_id, profile_uuid, bundle_id = sys.argv[2], sys.argv[3], sys.argv[4]

          text = path.read_text()

          # The three Runner *app* build configurations.
          RUNNER_CONFIG_IDS = [
              "97C147061CF9000F007C117D",  # Runner Debug
              "249021D4217E4FDB00AE95B9",  # Runner Profile
              "97C147071CF9000F007C117D",  # Runner Release
          ]

          SETTINGS = (
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              f"\t\t\t\tDEVELOPMENT_TEAM = {team_id};\n"
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_uuid}";\n'
          )

          REMOVE = re.compile(
              r"^\s*(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY"
              r"(?:\[sdk=iphoneos\*\])?|DEVELOPMENT_TEAM"
              r"|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE)"
              r"\s*=\s*[^;]+;\s*\n",
              re.MULTILINE,
          )

          def block_span(source, config_id):
              """Return (start, end) of one XCBuildConfiguration block."""
              m = re.search(
                  rf"^\t\t{re.escape(config_id)} /\* [^*]+ \*/ = \{{\n",
                  source,
                  re.MULTILINE,
              )
              if not m:
                  return None
              i = m.end()
              depth = 1
              while i < len(source) and depth:
                  ch = source[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                  i += 1
              return (m.start(), i) if not depth else None

          for config_id in RUNNER_CONFIG_IDS:
              span = block_span(text, config_id)
              if span is None:
                  raise SystemExit(
                      f"ERROR: Runner configuration {config_id} not found."
                  )

              start, end = span
              block = text[start:end]

              # Strip any conflicting existing signing keys.
              block = REMOVE.sub("", block)

              # Insert scoped signing right after buildSettings = {
              anchor = "\t\t\tbuildSettings = {\n"
              pos = block.find(anchor)
              if pos == -1:
                  raise SystemExit(
                      f"ERROR: buildSettings missing in {config_id}."
                  )
              insert = pos + len(anchor)
              block = block[:insert] + SETTINGS + block[insert:]

              # Normalise the app bundle identifier.
              block = re.sub(
                  r"^\s*PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;",
                  f"\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = {bundle_id};",
                  block,
                  flags=re.MULTILINE,
              )

              text = text[:start] + block + text[end:]
              print(f"  scoped signing applied to {config_id}")

          # Belt and braces: the misspelled Team ID must not survive anywhere.
          text = text.replace("PR4R9GAHZ3", team_id)

          if "PR4R9GAHZ3" in text:
              raise SystemExit("ERROR: misspelled Team ID still present.")
          if team_id not in text:
              raise SystemExit("ERROR: correct Team ID not written.")

          path.write_text(text)
          print("Runner signing scope configured.")
          PY

          # -----------------------------------------------------
          # Verify: Runner is manual, tests and Pods untouched
          # -----------------------------------------------------

          python3 - "$PBXPROJ" "$TEAM_ID" "$IOS_PROFILE_UUID" "$BUNDLE_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          team_id, profile_uuid, bundle_id = sys.argv[2], sys.argv[3], sys.argv[4]

          RUNNER_CONFIG_IDS = [
              "97C147061CF9000F007C117D",
              "249021D4217E4FDB00AE95B9",
              "97C147071CF9000F007C117D",
          ]

          REQUIRED = [
              "CODE_SIGN_STYLE = Manual;",
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              f"DEVELOPMENT_TEAM = {team_id};",
              f'PROVISIONING_PROFILE_SPECIFIER = "{profile_uuid}";',
              f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};",
          ]

          def block_span(source, config_id):
              m = re.search(
                  rf"^\t\t{re.escape(config_id)} /\* [^*]+ \*/ = \{{\n",
                  source,
                  re.MULTILINE,
              )
              if not m:
                  return None
              i = m.end()
              depth = 1
              while i < len(source) and depth:
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                  i += 1
              return (m.start(), i) if not depth else None

          for config_id in RUNNER_CONFIG_IDS:
              span = block_span(text, config_id)
              if span is None:
                  raise SystemExit(f"ERROR: {config_id} not found.")
              block = text[span[0]:span[1]]
              for setting in REQUIRED:
                  if setting not in block:
                      raise SystemExit(
                          f"ERROR: {config_id} missing: {setting}"
                      )

          # RunnerTests must NOT carry the app provisioning profile.
          tests_span = block_span(text, "331C8088294A63A400263BE5")
          if tests_span and profile_uuid in text[tests_span[0]:tests_span[1]]:
              raise SystemExit(
                  "ERROR: RunnerTests picked up the app provisioning profile."
              )

          print("")
          print("========================================")
          print("RUNNER SIGNING VERIFIED")
          print("========================================")
          print(f"Team ID:   {team_id}")
          print(f"Bundle ID: {bundle_id}")
          print(f"Profile:   {profile_uuid}")
          print("Identity:  Apple Distribution")
          print("Style:     Manual (Runner app target only)")
          print("Tests:     untouched (no app profile)")
          print("Pods:      untouched (automatic signing)")
          print("========================================")
          PY

          echo ""
          echo "Project diff for review:"
          diff -u "$RUNNER_TEMP/project.pbxproj.before" "$PBXPROJ" || true


      # =========================================================
      # 13. RE-SYNC COCOAPODS AFTER THE PROJECT WAS MODIFIED
      #
      # The 'Configure Runner target signing' step rewrites
      # Runner.xcodeproj/project.pbxproj to apply
      # signing. CocoaPods' sandbox check compares the project against
      # Podfile.lock/Manifest.lock, so that rewrite invalidates it and the
      # archive fails with:
      #     diff: /Podfile.lock: No such file or directory
      #     error: The sandbox is not in sync with the Podfile.lock.
      #
      # pod install is therefore re-run AFTER the last project change and
      # immediately before the archive, and the lock files are verified
      # explicitly so this fails here with a clear message rather than
      # inside xcodebuild.
      # =========================================================
      - name: Re-sync CocoaPods after project changes
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RE-SYNCING COCOAPODS"
          echo "========================================"

          cd ios

          echo "Podfile present:      $(test -f Podfile && echo yes || echo NO)"
          echo "Podfile.lock present: $(test -f Podfile.lock && echo yes || echo NO)"

          pod install

          # -----------------------------------------------------
          # Verify the integration is internally consistent
          # -----------------------------------------------------

          if [ ! -f Podfile.lock ]; then
            echo "ERROR: Podfile.lock was not produced by pod install."
            exit 1
          fi

          if [ ! -f Pods/Manifest.lock ]; then
            echo "ERROR: Pods/Manifest.lock is missing; the Pods sandbox was not installed."
            exit 1
          fi

          echo ""
          echo "Podfile.lock vs Pods/Manifest.lock:"

          if diff -q Podfile.lock Pods/Manifest.lock >/dev/null 2>&1; then
            echo "  in sync"
          else
            echo "ERROR: Podfile.lock and Pods/Manifest.lock differ."
            diff -u Podfile.lock Pods/Manifest.lock || true
            exit 1
          fi

          # Confirm the value the [CP] Check Pods Manifest.lock script relies
          # on is present in the Pods xcconfig the Runner target inherits.
          echo ""
          echo "PODFILE_LOCK in the Pods xcconfig Runner inherits:"

          pods_xcconfig="Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"

          if [ -f "$pods_xcconfig" ]; then
            grep 'PODFILE_LOCK' "$pods_xcconfig" || echo "  (no PODFILE_LOCK line in it)"
          else
            echo "  ERROR: $pods_xcconfig not found."
            ls -la "Pods/Target Support Files" 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "Pods include present in the Runner configurations:"
          grep -h 'Pods-Runner' Flutter/Debug.xcconfig Flutter/Release.xcconfig || true

          echo ""
          echo "========================================"
          echo "COCOAPODS RE-SYNCED"
          echo "========================================"

      # =========================================================
      # 14. ARCHIVE
      #
      # Signing is NOT passed as xcodebuild command-line arguments.
      # Global command-line build settings (DEVELOPMENT_TEAM,
      # CODE_SIGN_STYLE, CODE_SIGN_IDENTITY,
      # PROVISIONING_PROFILE_SPECIFIER) propagate to every target in the
      # workspace, including Pods-Runner, Firebase, gRPC, GoogleUtilities
      # and the rest, which produces:
      #   "does not support provisioning profiles, but provisioning
      #    profile ... has been manually specified"
      # The 'Configure Runner target signing' step scopes those settings to the Runner Release
      # configuration only, and the Pods keep automatic signing.
      # =========================================================
      - name: Archive VYRO
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ARCHIVING VYRO"
          echo "========================================"

          # Keep the keychain unlocked for codesign.
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Confirm the scoped signing settings are in place before the
          # long build, so a config problem fails in seconds not minutes.
          echo ""
          echo "Runner Release signing settings:"
          python3 - ios/Runner.xcodeproj/project.pbxproj <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          start = text.find("97C147071CF9000F007C117D /* Release */ = {")
          end = text.find("\n\t\t};\n", start)
          block = text[start:end]

          for key in (
              "CODE_SIGN_STYLE",
              "CODE_SIGN_IDENTITY",
              "DEVELOPMENT_TEAM",
              "PROVISIONING_PROFILE_SPECIFIER",
              "PRODUCT_BUNDLE_IDENTIFIER",
          ):
              found = re.search(rf"^\s*{key}\s*=\s*(.+?);\s*$", block, re.M)
              if not found:
                  raise SystemExit(f"ERROR: {key} missing from Runner Release.")
              print(f"  {key} = {found.group(1)}")

          if "PR4R9GAHZ3" in block:
              raise SystemExit(
                  "ERROR: typo Team ID PR4R9GAHZ3 is still present."
              )
          PY

          echo ""
          echo "Archiving (signing comes from the project, not the CLI)..."

          # xcodebuild is verbose and its 'Disabling previews' notes dominate
          # the tail of the log that GitHub surfaces on failure. Capture the
          # full output and re-print every error line afterwards so the real
          # cause is always visible.
          set +e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/VYRO.xcarchive" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "xcodebuild exit status: $ARCHIVE_STATUS"

          if [ "$ARCHIVE_STATUS" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "ARCHIVE FAILED - ERROR LINES"
            echo "========================================"

            # Actual diagnostics.
            grep -nE "(^| )error:|error: |fatal error:|does not support provisioning|No profiles for|could not find|is not in sync|requires a provisioning profile|Code Signing Error|The following build commands failed" \
              "$RUNNER_TEMP/archive.log" \
              | grep -vE "^[0-9]+:note:" \
              || echo "  (no line matched the error patterns)"

            echo ""
            echo "========================================"
            echo "ARCHIVE FAILED - LAST 60 LINES"
            echo "========================================"
            tail -n 60 "$RUNNER_TEMP/archive.log"

            echo ""
            echo "========================================"
            echo "ARCHIVE FAILED - SIGNING CONTEXT"
            echo "========================================"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            echo ""
            echo "Provisioning profiles installed:"
            ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "  (none)"
            echo ""
            echo "Archive log saved at: $RUNNER_TEMP/archive.log"

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "ARCHIVE SUCCEEDED"
          echo "========================================"

      # =========================================================
      # 15. VERIFY ARCHIVE
      # =========================================================
      - name: Verify archive
        run: |
          set -euo pipefail

          if [ ! -d "$RUNNER_TEMP/VYRO.xcarchive" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          echo "========================================"
          echo "ARCHIVE SUCCESSFUL"
          echo "========================================"

          ls -lah "$RUNNER_TEMP/VYRO.xcarchive"

      # =========================================================
      # 14b. UPLOAD THE FULL XCODEBUILD LOG
      #
      # GitHub only surfaces the tail of a build log on failure and the
      # 'Disabling previews' notes dominate it. Keeping the complete log
      # as an artifact means the real error is never lost to truncation.
      # =========================================================
      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn

      # =========================================================
      # 16. EXPORT IPA
      # =========================================================
      - name: Export IPA
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/export"

          echo "========================================"
          echo "EXPORTING IPA"
          echo "========================================"

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/VYRO.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" 2>&1 \
            | tee "$RUNNER_TEMP/export.log"
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "xcodebuild export exit status: $EXPORT_STATUS"

          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "EXPORT FAILED - ERROR LINES"
            echo "========================================"
            grep -nE "error:|error: |fatal error:|does not support provisioning|No profiles for|No signing certificate|Code Signing Error|Export failed|unable to" \
              "$RUNNER_TEMP/export.log" \
              || echo "  (no line matched the error patterns)"
            echo ""
            echo "Full export log tail:"
            tail -n 40 "$RUNNER_TEMP/export.log"
            echo ""
            echo "ExportOptions.plist in use:"
            cat ios/ExportOptions.plist
            exit 1
          fi

          echo ""
          echo "Exported files:"
          ls -lah "$RUNNER_TEMP/export"

      # =========================================================
      # 17. VERIFY IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -euo pipefail

          IPA="$(find "$RUNNER_TEMP/export" \
            -maxdepth 1 \
            -name '*.ipa' \
            -print \
            -quit)"

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "========================================"
          echo "IPA GENERATED SUCCESSFULLY"
          echo "========================================"
          echo "$IPA"

          cp "$IPA" "$RUNNER_TEMP/VYRO.ipa"

      # =========================================================
      # 18. UPLOAD IPA ARTIFACT
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-iOS
          path: ${{ runner.temp }}/VYRO.ipa
          if-no-files-found: error

      # =========================================================
      # 19. UPLOAD ARCHIVE
      # =========================================================
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-XCArchive
          path: ${{ runner.temp }}/VYRO.xcarchive
          if-no-files-found: error

      # =========================================================
      # 20. UPLOAD TO APP STORE CONNECT / TESTFLIGHT
      #
      # Authenticates with an App Store Connect API key. The three
      # secrets below are read from the environment, never printed
      # and never written to the repository.
      # =========================================================
      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "UPLOAD TO APP STORE CONNECT"
          echo "========================================"

          if [ -z "${ASC_KEY_ID:-}" ]; then
            echo "ERROR: APP_STORE_CONNECT_KEY_ID is not set."
            exit 1
          fi

          if [ -z "${ASC_ISSUER_ID:-}" ]; then
            echo "ERROR: APP_STORE_CONNECT_ISSUER_ID is not set."
            exit 1
          fi

          if [ -z "${ASC_PRIVATE_KEY:-}" ]; then
            echo "ERROR: APP_STORE_CONNECT_PRIVATE_KEY is not set."
            exit 1
          fi

          IPA="$RUNNER_TEMP/VYRO.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: $IPA not found."
            exit 1
          fi

          echo "IPA:        $IPA"
          echo "IPA size:   $(du -h "$IPA" | cut -f1)"
          echo "Key ID:     $ASC_KEY_ID"
          echo "Issuer ID:  ${ASC_ISSUER_ID:0:8}... (truncated)"

          # -----------------------------------------------------
          # Write the API key outside the repository
          # -----------------------------------------------------
          #
          # altool looks for AuthKey_<KEYID>.p8 in one of:
          #   ./private_keys
          #   ~/private_keys
          #   ~/.private_keys
          #   ~/.appstoreconnect/private_keys
          # A random working directory avoids the repository entirely.

          KEY_DIR="$RUNNER_TEMP/asc-keys"
          mkdir -p "$KEY_DIR/private_keys"

          printf '%s\n' "$ASC_PRIVATE_KEY" \
            > "$KEY_DIR/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          chmod 600 "$KEY_DIR/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          if [ ! -s "$KEY_DIR/private_keys/AuthKey_${ASC_KEY_ID}.p8" ]; then
            echo "ERROR: Failed to write the API private key."
            exit 1
          fi

          # -----------------------------------------------------
          # Confirm the key is a real .p8 before uploading
          # -----------------------------------------------------

          if ! grep -q "BEGIN PRIVATE KEY" \
            "$KEY_DIR/private_keys/AuthKey_${ASC_KEY_ID}.p8"; then
            echo "ERROR: APP_STORE_CONNECT_PRIVATE_KEY does not look like a"
            echo ".p8 private key. It must include the"
            echo "'-----BEGIN PRIVATE KEY-----' and"
            echo "'-----END PRIVATE KEY-----' lines."
            exit 1
          fi

          echo "API key written and validated."

          # Show the private key to ssh-agent/altool only from the temp dir.
          cd "$KEY_DIR"

          # -----------------------------------------------------
          # Upload
          # -----------------------------------------------------

          echo ""
          echo "Uploading IPA to App Store Connect..."
          echo "(Processing on App Store Connect can take 5-15 minutes.)"
          echo ""

          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

          echo ""
          echo "========================================"
          echo "UPLOAD SUCCEEDED"
          echo "========================================"
          echo "The build has been delivered to App Store Connect."
          echo "It will appear under TestFlight once processing completes."
          echo "========================================"

      # =========================================================
      # 21. CLEAN UP SIGNING MATERIAL
      # =========================================================
      - name: Clean up signing keychain and credentials
        if: always()
        run: |
          set -uo pipefail

          echo "Removing temporary signing material..."

          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
            echo "Deleted keychain: $KEYCHAIN_PATH"
          fi

          rm -f "$RUNNER_TEMP/apple_distribution.p12" || true
          rm -f "$RUNNER_TEMP/vyro.mobileprovision" || true
          rm -f "$RUNNER_TEMP/profile.plist" || true
          rm -rf "$RUNNER_TEMP/asc-keys" || true

          echo "Temporary signing material removed."
