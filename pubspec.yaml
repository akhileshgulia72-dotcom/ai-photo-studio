name: ai_photo_studio
description: "Choose a look, upload a photo, and create something extraordinary."
publish_to: 'none'

version: 1.0.0+14

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_app_check: ^0.4.7
  in_app_purchase: ^3.3.1

  image_picker: ^1.2.3

  google_mobile_ads: 9.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true



